<!DOCTYPE html>
<html>
<head>
    <title>House Price Estimation</title>
</head>
<body>
    <h1>House Price Estimation</h1>
    <form id="csvForm" enctype="multipart/form-data">
        <input type="file" name="file" accept=".csv" required>
        <button type="submit">Upload CSV</button>
    </form>

    <h2>Predict House Price</h2>
    <form id="predictForm">
        <label for="zip_code">Zip Code:</label>
        <input type="text" id="zip_code" name="zip_code" required><br>

        <label for="house_size">House Size (sqft):</label>
        <input type="number" id="house_size" name="house_size" required><br>

        <label for="acre_lot">Acre Lot:</label>
        <input type="number" id="acre_lot" name="acre_lot" step="0.01" required><br>

        <label for="bed">Bedrooms:</label>
        <input type="number" id="bed" name="bed" required><br>

        <label for="bath">Bathrooms:</label>
        <input type="number" id="bath" name="bath" step="0.1" required><br>

        <button type="submit">Predict Price</button>
    </form>

    <h2>Predicted Price:</h2>
    <p id="predictedPrice"></p>

    <script>
        const csvForm = document.getElementById('csvForm');
        const predictForm = document.getElementById('predictForm');
        const predictedPrice = document.getElementById('predictedPrice');

        csvForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const response = await fetch('/train', { method: 'POST', body: formData });
            const result = await response.json();
            alert(result.message);
        });

        predictForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });

            const response = await fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            predictedPrice.innerText = `Predicted Price: $${result.predicted_price.toFixed(2)}`;
        });
    </script>
</body>
</html>
