<!DOCTYPE html>
<html>
<head>
    <title>House Price Estimation</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>House Price Estimation</h1>
    
    <h2>Upload CSV File</h2>
    <input type="file" id="csvFile" accept=".csv">
    <button id="uploadButton">Upload</button>
    
    <h2>Select Features</h2>
    <div id="features"></div>
    <button id="trainButton" disabled>Train Model</button>
    
    <h2>Predict House Price</h2>
    <label for="zipCode">Zip Code:</label>
    <input type="text" id="zipCode"><br>
    <label for="squareMeters">Square Meters:</label>
    <input type="number" id="squareMeters"><br>
    <label for="acreSize">Acre Size:</label>
    <input type="number" id="acreSize"><br>
    <label for="bedrooms">Bedrooms:</label>
    <input type="number" id="bedrooms"><br>
    <label for="bathrooms">Bathrooms:</label>
    <input type="number" id="bathrooms"><br>
    <button id="predictButton" disabled>Predict Price</button>
    
    <h2>Predicted Price</h2>
    <p id="predictedPrice"></p>
    
    <script>
        var selectedFeatures = [];
        var uploadedData = null;

        function updateFeatures(features) {
            selectedFeatures = features;
            $("#features").empty();
            for (var i = 0; i < features.length; i++) {
                $("#features").append('<input type="checkbox" name="feature" value="' + features[i] + '"> ' + features[i] + '<br>');
            }
            $("#trainButton").prop("disabled", false);
        }

        $(document).ready(function() {
            $("#uploadButton").click(function() {
                var formData = new FormData();
                formData.append('file', $("#csvFile")[0].files[0]);

                $.ajax({
                    url: '/upload',
                    type: 'POST',
                    data: formData,
                    contentType: false,
                    processData: false,
                    success: function(response) {
                        updateFeatures(response.selected_features);
                        uploadedData = response.selected_features; // Store the uploaded data for training
                    },
                    error: function(error) {
                        console.log(error);
                    }
                });
            });

            $("#trainButton").click(function() {
                if (uploadedData) {
                    $.ajax({
                        url: '/train',
                        type: 'POST',
                        data: JSON.stringify({ data: uploadedData }),
                        contentType: 'application/json',
                        success: function(response) {
                            console.log(response.message);
                        },
                        error: function(error) {
                            console.log(error);
                        }
                    });
                } else {
                    console.log("No uploaded data.");
                }
            });

            $("#predictButton").click(function() {
                var input_data = {
                    zipCode: $("#zipCode").val(),
                    squareMeters: $("#squareMeters").val(),
                    acreSize: $("#acreSize").val(),
                    bedrooms: $("#bedrooms").val(),
                    bathrooms: $("#bathrooms").val()
                };

                $.ajax({
                    url: '/predict',
                    type: 'POST',
                    data: JSON.stringify({ input_data: input_data }),
                    contentType: 'application/json',
                    success: function(response) {
                        $("#predictedPrice").text("Predicted Price: $" + response.predicted_price.toFixed(2));
                    },
                    error: function(error) {
                        console.log(error);
                    }
                });
            });
        });
    </script>
</body>
</html>
